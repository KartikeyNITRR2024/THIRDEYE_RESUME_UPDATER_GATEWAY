spring.application.name=gateway
eureka.client.enabled=true 
eureka.client.register-with-eureka=true
spring.profiles.active=${PROFILE}
thirdeye.resume.updater.api.key=${THIRDEYE_RESUME_UPDATER_API_KEY}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
thirdeye.timezone = Asia/Kolkata
spring.main.web-application-type=reactive

spring.cloud.gateway.routes[0].id=THIRDEYE30-RESUMEHELPER-TOKENMANAGER
spring.cloud.gateway.routes[0].uri=lb://TOKENMANAGER
spring.cloud.gateway.routes[0].predicates[0]=Path=/tokenmanager/**
spring.cloud.gateway.routes[0].filters[0].name=Retry
spring.cloud.gateway.routes[0].filters[0].args.retries=3
spring.cloud.gateway.routes[0].filters[0].args.series=SERVER_ERROR
spring.cloud.gateway.routes[0].filters[0].args.statuses=BAD_GATEWAY,GATEWAY_TIMEOUT
spring.cloud.gateway.routes[0].filters[0].args.methods=GET
spring.cloud.gateway.routes[0].filters[0].args.exceptions=java.io.IOException,java.util.concurrent.TimeoutException
spring.cloud.gateway.routes[0].filters[0].args.backoff.firstBackoff=10ms
spring.cloud.gateway.routes[0].filters[0].args.backoff.maxBackoff=100ms
spring.cloud.gateway.routes[0].filters[0].args.backoff.factor=2
spring.cloud.gateway.routes[0].filters[0].args.backoff.basedOnPreviousValue=false

spring.cloud.gateway.routes[1].id=THIRDEYE30-RESUMEHELPER-RESUMEMANAGER
spring.cloud.gateway.routes[1].uri=lb://RESUMEMANAGER
spring.cloud.gateway.routes[1].predicates[0]=Path=/resumemanager/**
spring.cloud.gateway.routes[1].filters[0].name=Retry
spring.cloud.gateway.routes[1].filters[0].args.retries=3
spring.cloud.gateway.routes[1].filters[0].args.series=SERVER_ERROR
spring.cloud.gateway.routes[1].filters[0].args.statuses=BAD_GATEWAY,GATEWAY_TIMEOUT
spring.cloud.gateway.routes[1].filters[0].args.methods=GET
spring.cloud.gateway.routes[1].filters[0].args.exceptions=java.io.IOException,java.util.concurrent.TimeoutException
spring.cloud.gateway.routes[1].filters[0].args.backoff.firstBackoff=10ms
spring.cloud.gateway.routes[1].filters[0].args.backoff.maxBackoff=100ms
spring.cloud.gateway.routes[1].filters[0].args.backoff.factor=2
spring.cloud.gateway.routes[1].filters[0].args.backoff.basedOnPreviousValue=false